manifestVersion: 1
id: marble-server
storage:
  dataRoot: data
environment:
  - name: COSIGN_OPERATOR
    services:
      - server
    note: Your npub. With it, the server announces itself (kind 30243) naming you, so the Marble app can count it as yours. Then name it back from your key (kind 10243).
  - name: COSIGN_ENROLL
    services:
      - server
    default: invite
    options:
      - invite
      - open
    note: invite keeps it yours. open lets strangers store pieces of their keys on your home network, and it connects out from your home IP. A public server belongs on a VPS, with its outbound connections limited.
  - name: COSIGN_INVITES
    services:
      - server
    note: With invite, other devices' pubkeys (hex, comma separated) that may enroll a new account here.
category: social
name: Marble Server
version: "0.12.2"
tagline: Your own always-on co-signer for your Nostr account
icon: https://raw.githubusercontent.com/sybenx/cosign-umbrel/main/assets/icon.png
description: >-
  Marble keeps your Nostr account without your key sitting in any one place. Your phone
  holds 3 shares of your key, each server 1, and it takes 4 to sign: your phone plus any
  one server signs, and the servers together never can.


  Marble Server is a server of your own on your Umbrel. On first start it has no key yet:
  open it, scan "Add your phone" with the Marble app, and your phone and this server make
  a key together, so neither ever holds the whole of it. The Marble app asks your own
  server first, so public servers see less of what you sign.


  It connects out to public Nostr relays, so it needs no open port and works wherever
  your phone is. Its page, behind your Umbrel login, shows your key's members, the sites
  you've signed in to, and recent changes you can undo.


  It's private by default: only your own devices use it. Set your npub as its operator in
  the app's settings to have it announce itself as yours.


  Beta: signing uses the Zcash Foundation's audited FROST library; the Cosign protocol
  around it hasn't had an outside review yet.
releaseNotes: ""

developer: sybenx
website: https://cosign.aaro.cc
dependencies: []
repo: https://github.com/sybenx/cosign
support: https://github.com/sybenx/cosign/issues

port: 8711
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: sybenx
submission: https://github.com/sybenx/cosign-umbrel

# Shares must be gone for good after a refresh, so no backup may keep one: not your own
# (a/) and not anyone else's (groups/). A server that loses its share is replaced from
# the Marble app.
backupIgnore:
  - data/a/*
  - data/groups/*
