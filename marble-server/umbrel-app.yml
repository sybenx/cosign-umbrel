manifestVersion: 1
id: marble-server
storage:
  dataRoot: data
environment:
  - name: COSIGN_OPERATOR
    services:
      - server
    note: Your npub. With it, the server announces itself (kind 30243) naming you, so the Marble app can count it as yours. Then name it back from your key (kind 10243).
  - name: COSIGN_ENROLL
    services:
      - server
    default: invite
    options:
      - invite
      - open
    note: invite keeps it yours. open lets strangers store pieces of their keys on your home network, and it connects out from your home IP. A public server belongs on a VPS, with its outbound connections limited.
  - name: COSIGN_INVITES
    services:
      - server
    note: With invite, other devices' pubkeys (hex, comma separated) that may enroll a new account here.
category: social
name: Marble Server
version: "0.12.3"
tagline: Your own always-on helper for the Marble app
icon: https://raw.githubusercontent.com/sybenx/cosign-umbrel/main/assets/marble-tile.png
description: >-
  Marble Server keeps one piece of your Marble account at home, so you don't have to rely
  only on public servers. Install the Marble app on your phone, open this server's page,
  and scan "Add this server to your account" with Marble's Add a server.


  It's private: only accounts you add with its code can use it, and its page is behind
  your Umbrel login. Each code works once, on this server only, for an hour. Get the
  Marble app at https://cosign.aaro.cc.


  Marble can't take a server out of your account yet, so a server you add stays in it
  until that comes.


  Your phone holds the bigger part of your account and this server a smaller one. They
  work together, and neither can act on its own. It only connects out, so it needs no
  open port and works wherever your phone is.


  Beta: the way Marble splits and moves your account hasn't had an outside review yet.
releaseNotes: >-
  Add this server to your Marble account: its page shows a code that Marble's Add a
  server scans. The page is rewritten to say what's running and who uses it.

developer: sybenx
website: https://cosign.aaro.cc
dependencies: []
repo: https://github.com/sybenx/cosign
support: https://github.com/sybenx/cosign/issues

port: 8711
gallery: []
path: ""

defaultUsername: ""
defaultPassword: ""

submitter: sybenx
submission: https://github.com/sybenx/cosign-umbrel

# Shares must be gone for good after a refresh, so no backup may keep one: not your own
# (a/) and not anyone else's (groups/). A server that loses its share is replaced from
# the Marble app.
backupIgnore:
  - data/a/*
  - data/groups/*
