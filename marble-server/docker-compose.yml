version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: marble-server_server_1
      APP_PORT: 8711

  server:
    image: ghcr.io/sybenx/cosign-server:0.12.9@sha256:11d5b7d225349ccf2c3fbeda1edb80a26d094036a92b90cb643880e36f11b887
    user: "1000:1000"
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # No account of its own (one made with your phone would have only this server): your
      # existing Marble account adds it with the code on its page.
      COSIGN_PERSONAL: "0"
      COSIGN_ENROLL: invite
      COSIGN_RELAYS: wss://syb.lol,wss://nos.lol,wss://relay.primal.net
    volumes:
      - ${APP_DATA_DIR}/data:/data
