version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: marble-server_server_1
      APP_PORT: 8711

  server:
    image: ghcr.io/sybenx/cosign-server:0.12.10@sha256:7e276f6e6698d9f0b34245131b7abd7c51969aa0f62c3f0be53adf04893ced08
    user: "1000:1000"
    restart: on-failure
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    environment:
      # No account of its own (one made with your phone would have only this server): your
      # existing Marble account adds it with the code on its page.
      COSIGN_PERSONAL: "0"
      COSIGN_ENROLL: invite
      COSIGN_RELAYS: wss://syb.lol,wss://nos.lol,wss://relay.primal.net
    volumes:
      - ${APP_DATA_DIR}/data:/data
